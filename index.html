<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Waie Music Project</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a;
    --neon-white: #ffffff;
    --neon-blue: #4da3ff;
    --neon-blue-soft: rgba(77,163,255,0.5);
    --glass: rgba(15, 20, 35, 0.45);
    --glass-border: rgba(255,255,255,0.08);
    --text: #eef2ff;
    --muted: #8a93ab;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background: var(--bg); color: var(--text); min-height:100vh;
    padding-bottom: 190px; overflow-x:hidden; position:relative;
  }
  .bg-glow {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 15% 20%, rgba(77,163,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(120,80,255,0.12), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03), transparent 60%),
      linear-gradient(180deg, #05060a 0%, #070b14 100%);
  }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  svg { width:20px; height:20px; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  .header {
    position:sticky; top:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px;
    border-left:none; border-right:none; border-top:none; border-radius:0;
  }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-mark {
    width:40px; height:40px; border-radius:12px;
    background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 100%);
    box-shadow: 0 0 18px var(--neon-blue-soft), inset 0 0 10px rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
    color:#05060a; font-weight:800; font-size:20px;
  }
  .logo h1 { font-size:17px; font-weight:700; letter-spacing:0.3px; }
  .logo h1 span { color: var(--neon-blue); text-shadow:0 0 12px var(--neon-blue-soft); }
  .logo p { font-size:8px; color:var(--muted); letter-spacing:3px; margin-top:2px; }

  .icon-btn {
    background: rgba(255,255,255,0.05);
    border:1px solid var(--glass-border); color:var(--text);
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:0.2s;
  }
  .icon-btn:hover { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow:0 0 12px var(--neon-blue-soft); }

  .container { max-width:720px; margin:0 auto; padding:22px 16px; position:relative; z-index:1; }

  .title-section { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:10px; }
  .title-section h2 {
    font-size:24px; font-weight:700;
    background: linear-gradient(90deg, #ffffff 0%, #c9dcff 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .title-section p { font-size:12px; color:var(--muted); margin-top:4px; }
  .badge {
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:10px;
    font-size:10px; font-weight:600; letter-spacing:1px; color:var(--neon-blue);
    text-transform:uppercase;
  }
  .badge .dot {
    width:6px; height:6px; border-radius:50%; background:var(--neon-blue);
    box-shadow:0 0 8px var(--neon-blue); animation:pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .search-box { position:relative; border-radius:16px; margin-bottom:22px; }
  .search-box input {
    width:100%; height:56px; background:transparent;
    border:none; outline:none; color:var(--text); padding:0 50px;
    font-size:14px; font-weight:500;
  }
  .search-box input::placeholder { color:var(--muted); }
  .search-box .search-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .search-box:focus-within { border-color: var(--neon-blue); box-shadow:0 0 0 1px var(--neon-blue-soft), 0 0 24px var(--neon-blue-soft); }
  .clear-btn {
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    background:rgba(255,255,255,0.06); border:1px solid var(--glass-border);
    color:var(--muted); width:28px; height:28px; border-radius:50%;
    cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  .clear-btn.show { display:flex; }
  .clear-btn svg { width:14px; height:14px; }

  .results { display:flex; flex-direction:column; gap:10px; }
  .track {
    display:flex; align-items:center; gap:12px; padding:10px;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border:1px solid var(--glass-border); border-radius:14px;
    cursor:pointer; transition:0.22s;
  }
  .track:hover { border-color: var(--neon-blue-soft); background: rgba(77,163,255,0.06); transform:translateY(-1px); }
  .track.playing {
    border-color: var(--neon-blue);
    background: linear-gradient(135deg, rgba(77,163,255,0.14), rgba(255,255,255,0.03));
    box-shadow: 0 0 0 1px var(--neon-blue-soft), 0 0 22px rgba(77,163,255,0.22);
  }
  .track-thumb { width:64px; height:54px; border-radius:10px; object-fit:cover; flex-shrink:0; background: rgba(255,255,255,0.05); }
  .track-info { flex:1; min-width:0; }
  .track-title { font-size:13px; font-weight:600; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track-channel { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track-play {
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--neon-blue); background: rgba(77,163,255,0.08);
    color: var(--neon-blue);
    box-shadow:0 0 12px var(--neon-blue-soft), inset 0 0 8px rgba(77,163,255,0.2);
  }
  .track-play svg { width:14px; height:14px; fill:currentColor; stroke:none; }

  .empty-state, .loading-state { text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; }
  .empty-icon { font-size:56px; color:var(--neon-blue); opacity:0.5; margin-bottom:12px; text-shadow:0 0 20px var(--neon-blue-soft); }
  .spinner {
    width:38px; height:38px; margin:0 auto 15px;
    border:3px solid rgba(77,163,255,0.15);
    border-top-color: var(--neon-blue); border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .player-bar {
    position:fixed; bottom:90px; left:15px; right:15px;
    border-radius:20px; padding:14px 16px;
    display:none; z-index:20; max-width:690px; margin:0 auto;
  }
  .player-bar.show { display:block; animation:slideUp 0.3s ease; }
  @keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

  .player-info { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .player-thumb { width:44px; height:44px; border-radius:10px; object-fit:cover; background: rgba(255,255,255,0.05); box-shadow:0 0 12px rgba(77,163,255,0.25); }
  .player-text { flex:1; min-width:0; }
  .player-title { font-size:12px; font-weight:600; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .player-channel { font-size:10px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .player-controls { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .player-btn {
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--glass-border); background: rgba(255,255,255,0.04);
    color: var(--muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:0.2s;
  }
  .player-btn:hover { color: var(--neon-blue); border-color: var(--neon-blue-soft); }
  .player-btn.play {
    width:46px; height:46px;
    border:1.5px solid var(--neon-blue);
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(77,163,255,0.15));
    color: #ffffff;
    box-shadow: 0 0 18px var(--neon-blue-soft), inset 0 0 10px rgba(255,255,255,0.08);
  }
  .player-btn.play svg { width:18px; height:18px; fill:currentColor; stroke:none; }
  .player-btn.active { color: var(--neon-blue); border-color: var(--neon-blue); box-shadow:0 0 12px var(--neon-blue-soft); }

  .progress-bar { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .progress-track {
    flex:1; height:4px; border-radius:3px;
    background: rgba(255,255,255,0.08); cursor:pointer; position:relative;
  }
  .progress-fill {
    height:100%; width:0%; border-radius:3px;
    background: linear-gradient(90deg, #ffffff, var(--neon-blue));
    box-shadow:0 0 10px var(--neon-blue-soft);
    position:relative; transition: width 0.1s;
  }
  .progress-fill::after {
    content:''; position:absolute; right:-4px; top:50%; transform:translateY(-50%);
    width:10px; height:10px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px var(--neon-blue);
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    z-index:15;
    display:flex; align-items:center; gap:4px;
    padding:8px 10px;
    border-radius:24px;
    background: rgba(10, 14, 26, 0.65);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.6),
      0 0 0 1px rgba(77,163,255,0.06),
      inset 0 1px 0 rgba(255,255,255,0.08);
    width: calc(100% - 30px);
    max-width: 380px;
  }

  .nav-item {
    flex:1;
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 6px;
    border-radius:16px;
    font-size:9px; font-weight:600;
    letter-spacing:0.5px;
    color: var(--muted);
    cursor:pointer;
    overflow:hidden;
    transition: color 0.28s ease, background 0.28s ease, transform 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-item .nav-icon {
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    position:relative;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.28s ease, box-shadow 0.28s ease;
  }

  .nav-item .nav-icon svg {
    width:20px; height:20px;
    transition: stroke 0.28s ease, transform 0.3s ease;
  }

  .nav-item:hover { color:#c9dcff; }
  .nav-item:hover .nav-icon svg { transform: scale(1.08); }

  .nav-item.active {
    color: #ffffff;
  }
  .nav-item.active .nav-icon {
    background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(77,163,255,0.22));
    box-shadow:
      0 0 14px rgba(77,163,255,0.5),
      inset 0 0 10px rgba(255,255,255,0.15),
      0 0 0 1px rgba(77,163,255,0.35);
    transform: translateY(-2px);
  }
  .nav-item.active .nav-icon svg {
    stroke: #ffffff;
    filter: drop-shadow(0 0 6px var(--neon-blue));
  }
  .nav-item.active span {
    text-shadow: 0 0 8px rgba(77,163,255,0.7);
  }

  .nav-item.active::after {
    content:'';
    position:absolute;
    bottom:2px; left:50%; transform:translateX(-50%);
    width:18px; height:2px;
    border-radius:2px;
    background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
    box-shadow: 0 0 8px var(--neon-blue);
    animation: navPulse 2s ease-in-out infinite;
  }
  @keyframes navPulse {
    0%,100% { opacity:0.6; transform:translateX(-50%) scaleX(1); }
    50% { opacity:1; transform:translateX(-50%) scaleX(1.4); }
  }

  .nav-item.tapped .nav-icon {
    animation: tapBounce 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes tapBounce {
    0% { transform: translateY(-2px) scale(1); }
    40% { transform: translateY(-6px) scale(0.9); }
    100% { transform: translateY(-2px) scale(1); }
  }

  .nav-item .ripple {
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, rgba(77,163,255,0.5) 0%, transparent 70%);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events:none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity:0; }
  }

  .toast {
    position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-10px);
    padding:12px 22px; border-radius:12px; font-size:12px; font-weight:500;
    z-index:2000; color: var(--neon-blue); border-color: var(--neon-blue-soft);
    opacity:0; pointer-events:none; transition:0.3s;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error { color:#ff7777; border-color: rgba(255,119,119,0.5); }

  #ytPlayer { position:fixed; bottom:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background: rgba(77,163,255,0.3); border-radius:3px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>

<div class="bg-glow"></div>

<header class="header glass">
  <div class="logo">
    <div class="logo-mark">♪</div>
    <div>
      <h1>Waie<span>Music</span></h1>
      <p>MUSIC · FEEL THE FLOW</p>
    </div>
  </div>
  <button class="icon-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
</header>

<main class="container">
  <section class="title-section">
    <div>
      <h2>Cari Musik</h2>
      <p>Temukan & putar lagu favorit lu.</p>
    </div>
    <div class="badge glass"><span class="dot"></span> Online</div>
  </section>

  <div class="search-box glass">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Cari lagu, artis, album...">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="results" id="results">
    <div class="empty-state">
      <div class="empty-icon">♪</div>
      <p>Cari lagu buat mulai</p>
    </div>
  </div>
</main>

<div class="player-bar glass" id="playerBar">
  <div class="player-info">
    <img class="player-thumb" id="playerThumb" src="">
    <div class="player-text">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-channel" id="playerChannel">—</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="player-btn" onclick="shuffleToggle()" id="shuffleBtn">
      <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>
    <button class="player-btn" onclick="prevTrack()">
      <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;"><polygon points="19 20 9 12 19 4 19 20"/><rect x="4" y="5" width="2" height="14"/></svg>
    </button>
    <button class="player-btn play" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24" style="fill:currentColor;stroke:none;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <button class="player-btn" onclick="nextTrack()">
      <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;"><polygon points="5 4 15 12 5 20 5 4"/><rect x="18" y="5" width="2" height="14"/></svg>
    </button>
    <button class="player-btn" onclick="repeatToggle()" id="repeatBtn">
      <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>
  <div class="progress-bar">
    <span id="currentTime">0:00</span>
    <div class="progress-track" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span id="duration">0:00</span>
  </div>
</div>

<nav class="bottom-nav glass">
  <div class="nav-item active" data-tab="search" onclick="switchTab(this)">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <span>Search</span>
  </div>
  <div class="nav-item" data-tab="library" onclick="switchTab(this)">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <span>Library</span>
  </div>
  <div class="nav-item" data-tab="profile" onclick="switchTab(this)">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <span>Profile</span>
  </div>
</nav>

<div class="toast glass" id="toast"></div>
<div id="ytPlayer"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
        </html>
